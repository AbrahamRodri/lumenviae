# fly.toml app configuration file generated for lumenviae on 2025-10-23T15:15:09-05:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'lumenviae'
primary_region = 'dfw'
kill_signal = 'SIGTERM'

[build]

[deploy]
  release_command = '/app/bin/migrate'

[env]
  PHX_HOST = 'www.lumenviae.org'
  PORT = '8080'
  POOL_SIZE = '5'
  # The Divine Office engine, self-hosted as the private Fly app in
  # deploy/divinum-officium/fly.toml (see docs/OFFICE_API.md for why).
  DIVINUM_OFFICIUM_BASE_URL = 'http://lumenviae-office.flycast'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 100
    soft_limit = 50

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
