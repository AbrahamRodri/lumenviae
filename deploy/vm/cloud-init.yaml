#cloud-config
# Server setup for one site on one Hetzner Cloud server (Ubuntu 24.04 LTS),
# pasted into "Cloud config" when the server is created. The recipe is
# docs/HOSTING_RECIPE.md. Per site, change only the two SSH keys and the
# folder name in runcmd (/srv/lumenviae).
#
# What it does: two users (admin for a person, deploy for CI), SSH by key
# only, automatic security upgrades with a 04:00 UTC reboot when one needs
# it, Docker with bounded logs, and ufw. Docker's published ports bypass
# ufw, so the firewall that matters for 80 and 443 is the Hetzner Cloud
# Firewall in front of the server (the recipe says which rules).

users:
  # A person: sudo, for setup and repairs.
  - name: admin
    groups: [sudo, docker]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 REPLACE-with-the-owner's-public-key admin"
  # CI's deploy (the deploy-vm job): Docker only, no sudo. Docker access is
  # root-equivalent all the same, so its key is a repository secret and
  # nowhere else.
  - name: deploy
    groups: [docker]
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 REPLACE-with-the-CI-deploy-public-key deploy"

disable_root: true
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/10-recipe.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/52recipe-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
  # Each container's logs capped (the local driver keeps 100MB by default),
  # so a noisy app cannot fill the disk.
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "local"}

runcmd:
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl restart ssh
  - systemctl enable --now docker
  - systemctl restart docker
  - install -d -o deploy -g deploy -m 750 /srv/lumenviae
