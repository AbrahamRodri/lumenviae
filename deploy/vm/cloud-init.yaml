#cloud-config
# Server setup for one site on one DigitalOcean Droplet (Ubuntu 24.04 LTS),
# pasted into "User data" when the Droplet is created. The recipe is
# docs/HOSTING_RECIPE.md. Per site, change only the person's user name
# (abraham, in two places), the two SSH keys and the folder name in runcmd
# (/srv/lumenviae).
#
# What it does: two users (the owner's, for a person, and deploy, for CI), SSH by key
# only, automatic security upgrades with a 04:00 UTC reboot when one needs
# it, a 2GB swap file (a 1GB Droplet runs the app and Postgres together),
# Docker with bounded logs, and ufw. Docker's published ports bypass
# ufw, so the firewall that matters for 80 and 443 is the DigitalOcean
# Cloud Firewall in front of the Droplet (the recipe says which rules).

users:
  # A person: sudo, for setup and repairs. The users are made before any
  # package is installed, so they cannot name the docker group here:
  # useradd refuses a group that does not exist yet, cloud-init then makes
  # no user, and no key works (the first Droplet, 2 Nov 2026). Both join
  # the docker group in runcmd, once Docker has made it. The name is the
  # person's own rather than "admin", the name that failed there.
  - name: abraham
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 REPLACE-with-the-owner's-public-key abraham"
  # CI's deploy (the deploy-vm job): Docker only, no sudo. Docker access is
  # root-equivalent all the same, so its key is a repository secret and
  # nowhere else.
  - name: deploy
    shell: /bin/bash
    lock_passwd: true
    ssh_authorized_keys:
      - "ssh-ed25519 REPLACE-with-the-CI-deploy-public-key deploy"

disable_root: true
ssh_pwauth: false

package_update: true
package_upgrade: true
packages:
  - docker.io
  - docker-compose-v2
  - unattended-upgrades
  - ufw

write_files:
  - path: /etc/ssh/sshd_config.d/10-recipe.conf
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin no
  - path: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
  - path: /etc/apt/apt.conf.d/52recipe-reboot
    content: |
      Unattended-Upgrade::Automatic-Reboot "true";
      Unattended-Upgrade::Automatic-Reboot-Time "04:00";
  # Each container's logs capped (the local driver keeps 100MB by default),
  # so a noisy app cannot fill the disk.
  - path: /etc/docker/daemon.json
    content: |
      {"log-driver": "local"}
  # Swap used only under pressure, so it catches a spike rather than slowing
  # every request.
  - path: /etc/sysctl.d/60-recipe-swap.conf
    content: |
      vm.swappiness = 10

runcmd:
  - fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
  - echo '/swapfile none swap sw 0 0' >> /etc/fstab
  - sysctl --system
  - ufw default deny incoming
  - ufw default allow outgoing
  - ufw allow OpenSSH
  - ufw allow 80/tcp
  - ufw allow 443/tcp
  - ufw --force enable
  - systemctl restart ssh
  - systemctl enable --now docker
  - systemctl restart docker
  - usermod -aG docker abraham
  - usermod -aG docker deploy
  - install -d -o deploy -g deploy -m 750 /srv/lumenviae
