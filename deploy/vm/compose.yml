# Lumen Viae on one VM: the app, Postgres, the Office engine and Caddy.
# Not used while the repository variable HOSTING is unset: production is
# Fly (fly.toml). The switch is reports/rig/hosting-migration.md's runbook
# and deploy/vm/README.md.
#
# On the VM this folder is /srv/lumenviae, beside its .env (mode 600; the
# names are in env.example). The deploy sets IMAGE (the release image built
# from main's commit) and RELEASE_COMMIT, then runs
#   docker compose run --rm app /app/bin/migrate
#   docker compose up -d --wait
name: lumenviae

services:
  app:
    image: ${IMAGE:?set IMAGE to the release image}
    command: /app/bin/server
    env_file: .env
    environment:
      RELEASE_COMMIT: ${RELEASE_COMMIT:-unknown}
      DIVINUM_OFFICIUM_BASE_URL: http://office:8080
      # Caddy replaces X-Real-IP with the peer it saw (Caddyfile).
      CLIENT_IP_HEADER: x-real-ip
      PHX_HOST: www.lumenviae.org
      PORT: "8080"
      POOL_SIZE: "5"
      # rel/env.sh.eex names the node after the hostname, which here is the
      # container id. Distribution refuses that as a long name, so the rpc
      # healthcheck below fails and `up --wait` never sees the app healthy.
      RELEASE_NODE: lumen_viae@127.0.0.1
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    # No published port: only Caddy reaches it, so X-Real-IP is always
    # Caddy's.
    # The release image has no curl (the Dockerfile is Fly's too, left as
    # it is): ask the running release whether its endpoint is up. The
    # deploy's post-deploy checks then test it over HTTPS.
    healthcheck:
      test: ["CMD", "/app/bin/lumen_viae", "rpc", "LumenViaeWeb.Endpoint.url()"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 3

  db:
    image: postgres:17
    environment:
      POSTGRES_DB: lumen_viae
      POSTGRES_USER: lumen_viae
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lumen_viae -d lumen_viae"]
      interval: 5s
      timeout: 5s
      retries: 10

  # The same image as deploy/divinum-officium/fly.toml, with 2 workers
  # instead of 4: it shares a 1GB Droplet, and its traffic never fills 2.
  # Pulled from our own GHCR copy, which the deploy fills from upstream
  # with the same digest, so upstream deleting it no longer matters.
  # docs/OFFICE_API.md ("Updating the engine") says how to change it.
  office:
    image: ghcr.io/abrahamrodri/divinum-officium@sha256:ef674f7973adc8b1029c4a5d2275d76c1fe222f810f0dfd4369c2930964d3aa7
    command: starman --port 8080 --host 0.0.0.0 --workers 2 --preload-app --user www-data --group www-data /var/www/app.psgi
    restart: unless-stopped

  # Built once and then kept: the deploy runs `up` without `--build`. With
  # Compose 2.40 and no buildx, every rebuild gave Caddy a new image id,
  # so each deploy recreated it and dropped HTTPS for a few seconds. The
  # deploy reloads the Caddyfile in place instead. After changing
  # caddy/Dockerfile, raise the tag's last number: the next deploy builds
  # the new tag and restarts Caddy once.
  caddy:
    build: ./caddy
    image: lumenviae-caddy:2.10-cloudflare-1
    ports:
      - "80:80"
      - "443:443"
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?set CLOUDFLARE_API_TOKEN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
