# The Fly app "lumenviae" as a pass-through to https://www.lumenviae.org
# (README.md). Deployed by hand from this folder, never by CI:
#   fly deploy --config deploy/fly-proxy/fly.toml --local-only
# The repository's own fly.toml is the full app, for a rollback to Fly.
app = 'lumenviae'
primary_region = 'dfw'

[build]
  dockerfile = 'Dockerfile'

[deploy]
  # One machine: bluegreen boots the proxy beside the old app machine and
  # moves traffic once the proxy's check passes, so the switch drops nothing.
  strategy = 'bluegreen'

[http_service]
  internal_port = 8080
  force_https = true
  # Always on, so an iPhone's first request is not a cold start.
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'connections'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    grace_period = '10s'
    interval = '15s'
    timeout = '5s'
    method = 'GET'
    path = '/_proxy/up'

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1
