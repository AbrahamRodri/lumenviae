# Production, checked every hour: every feature the apps depend on,
# read-only (bin/prod-feature-check, docs/DEPLOY_WATCH.md). A failure fails
# the run, GitHub emails the repository's owner, and the healthchecks.io
# check "lumenviae prod" (secret HC_PROD_PING_URL) gets the run's output on
# /fail and emails too; a run that never pings (Actions down, the schedule
# paused) is noticed by that check's grace time. Start it by hand from the
# Actions tab at any time.
#
# Hourly costs nothing: the repository is public, and GitHub-hosted runners
# are free and unmetered for public repositories (a run takes about 15 s).
# The minute is off the hour because GitHub delays scheduled runs at :00.
name: Production check

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check every feature
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: bin/prod-feature-check | tee "$RUNNER_TEMP/prod-check.txt"
        shell: bash -o pipefail {0}
        env:
          OPS_STATUS_TOKEN: ${{ secrets.OPS_STATUS_TOKEN }}
      # Success pings the check; a failure pings its /fail with the output,
      # which healthchecks.io shows in the email. Without the secret it says
      # so and passes, so the check runs before the secret is added.
      - name: Ping healthchecks.io
        if: ${{ !cancelled() }}
        env:
          HC_PROD_PING_URL: ${{ secrets.HC_PROD_PING_URL }}
          OUTCOME: ${{ steps.check.outcome }}
        run: |
          if [ -z "$HC_PROD_PING_URL" ]; then
            echo "HC_PROD_PING_URL is not set: no ping"
            exit 0
          fi
          url=$HC_PROD_PING_URL
          [ "$OUTCOME" = success ] || url=$HC_PROD_PING_URL/fail
          touch "$RUNNER_TEMP/prod-check.txt"
          curl -fsS -m 10 --retry 3 --data-binary "@$RUNNER_TEMP/prod-check.txt" "$url" > /dev/null
