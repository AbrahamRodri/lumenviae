schema {
  mutation: RootMutationType
  query: RootQueryType
}

type ScheduleDays {
  "What the app shows under the set's name: `days_prayed`, or for a set the schedule never reaches, when it is kept (`Fridays, and on her feast, September 15`; `Any day you choose`)."
  words: String!

  "The days the schedule prays it (`Monday, Thursday, Sundays of Advent`), or null when the schedule never reaches it: the Luminous on the traditional schedule, the Seven Sorrows on either."
  daysPrayed: String

  "A category slug."
  category: String!
}

type ScheduleSunday {
  "Any other Sunday, Christmastide and Eastertide included."
  ordinary: String!

  "A Sunday of Lent."
  lent: String!

  "A Sunday of Advent."
  advent: String!
}

type ScheduleWeekdays {
  "A category slug."
  wednesday: String!

  "A category slug."
  tuesday: String!

  "A category slug."
  thursday: String!

  "A category slug."
  saturday: String!

  "A category slug."
  monday: String!

  "A category slug."
  friday: String!
}

type MysterySchedule {
  "The category of each day from Monday to Saturday. The day is the device's calendar day, turning at midnight; not the prayer day that turns at four in the morning."
  weekdays: ScheduleWeekdays!

  "Sunday's category, by the season the Sunday falls in (see `seasons`)."
  sunday: ScheduleSunday!

  "`traditional` (Joyful on Thursday, Glorious on Saturday) or `modern` (Rosarium Virginis Mariae 38: Luminous on Thursday, Joyful on Saturday)."
  id: String!

  "Category slugs in the order the home grid shows them: the sets the week prays, in the week's order from Monday, then the Seven Sorrows."
  grid: [String!]!

  "Each of the five categories, in the app's order, with the days it is prayed in words."
  days: [ScheduleDays!]!
}

type RosarySeason {
  "Its first day: Ash Wednesday, or the first Sunday of Advent."
  startsOn: Date!

  "`lent` or `advent`."
  season: String!

  "Its last day, included: Holy Saturday, or December 24. Easter and Christmas are ordinary."
  endsOn: Date!
}

type RosarySchedule {
  "The last date `seasons` answers for: December 31 three years ahead."
  seasonsThrough: Date!

  "The first date `seasons` answers for: January 1 of last year. The range moves on when the year turns, and with it the document's version."
  seasonsFrom: Date!

  "Every Lent and Advent from `seasons_from` through `seasons_through`, in calendar order. A date inside one is in that season; every other date in the range is `ordinary`, Christmastide and Eastertide included."
  seasons: [RosarySeason!]!

  "The weekly schedules, the default first. A client should pass over a schedule whose id it does not know."
  schedules: [MysterySchedule!]!

  "The id of the schedule a client follows until its reader chooses another: `traditional`."
  default: String!
}

type PrayerText {
  "In Latin, line by line."
  la: [String!]!

  "In English, line by line."
  en: [String!]!
}

type PrayerTitle {
  "In Latin."
  la: String!

  "In English."
  en: String!
}

type RosaryPrayer {
  "The prayer's name."
  title: PrayerTitle!

  "The words, as lines broken where they are shown. Both languages have the same number of lines, so they pair line for line. A line in square brackets is a rubric (`[Let us pray.]`)."
  text: PrayerText!

  "The app's prayer id (`hail_mary`), the key the spoken Rosary's recordings and steps use."
  id: String!

  "`rosary`: one of the Rosary's eight prayers. `chaplet`: the Seven Sorrows chaplet's own. `after`: an optional prayer after the Rosary. A client should keep a prayer whose group it does not know."
  group: String!
}

type VerseClip {
  reference: String
  file: String!
  bead: Int!
  audio: SignedAudio!
}

type VerseGroup {
  key: String!
  clips: [VerseClip!]!
}

type AnnouncementClip {
  text: String
  key: String!
  file: String!
  audio: SignedAudio!
}

type RosaryClip {
  title: String
  id: String!
  file: String!
  audio: SignedAudio!
}

type ArtworkAttribution {
  year: String
  title: String
  sourceUrl: String
  license: String!
  artist: String
}

type Artwork {
  width: Int
  url: String!
  height: Int
  focalY: Float!
  focalX: Float!
  attribution: ArtworkAttribution!
  alt: String!
  alignment: String!
}

type MeditationNarration {
  voice: String!
  meditationId: ID!
  audio: SignedAudio!
}

type SignedAudio {
  url: String!
  expiresAt: DateTime!
}

type SignedNarration {
  voice: String!
  audio: SignedAudio!
}

type OfficeChoice {
  slug: String!
  label: String!
}

type OfficeVocabulary {
  versions: [OfficeChoice!]!
  languages: [OfficeChoice!]!
  hours: [OfficeChoice!]!
  defaultVersion: String!
  defaultLanguage: String!
}

type OfficeCalendar {
  year: Int!
  version: String!
  month: Int!
  days: [OfficeDay!]!
}

type OfficeDayDetail {
  text: String
  label: String
}

type OfficeDay {
  note: String
  letter: String
  detail: OfficeDayDetail
  date: Date!
  celebration: OfficeCelebration
}

type OfficeCelebration {
  title: String!
  rank: String
}

type OfficeCell {
  title: String
  note: String
  lines: [String!]!
}

type OfficeSection {
  vernacular: OfficeCell
  latin: OfficeCell
}

type OfficeSource {
  url: String!
  name: String!
}

type OfficeHour {
  version: String!
  tempora: String
  source: OfficeSource!
  sections: [OfficeSection!]!
  language: String!
  hour: String!
  date: Date!
  celebration: OfficeCelebration
}

"An error generated by a failed mutation"
type MutationError {
  "The human readable error message"
  message: String

  "A shorter error message, with vars not replaced"
  shortMessage: String

  "Replacements for the short message"
  vars: Json

  "An error code for the given error"
  code: String

  "The field or fields that produced the error"
  fields: [String!]

  "The path to the field that produced the error"
  path: [String!]
}

type RosaryContent {
  "Always `current`: there is one document."
  id: String!

  "Fingerprints everything the document serves: a device whose copy has the same version holds every current word. Compare it; do not parse it."
  version: String!

  "When the content last changed."
  updatedAt: DateTime!

  "The twelve prayers of the Rosary and the Seven Sorrows chaplet, in the order they are said, in English and Latin."
  prayers: [RosaryPrayer!]!

  "Which mysteries a day calls for, on both weekly schedules, as rules to apply offline: each weekday's set, Sunday's by season, every Lent and Advent from last year to three years ahead, the home grid's order and the days each set is prayed in words. The day is the device's calendar day, turning at midnight, not the prayer day that turns at four in the morning."
  schedule: RosarySchedule!
}

type SpokenRosary {
  "The voice actually served: the one asked for, or its successor when it is retired, or the default when none was asked for or the slug names no voice."
  voice: String!

  "Fingerprints every file in the voice's catalogue: a device whose pack has the same version holds every current recording."
  version: String!

  "The earliest moment any URL in this response stops working."
  expiresAt: DateTime!

  "The fixed prayers, in the order they are said."
  prayers: [RosaryClip!]!

  "One announcement per mystery."
  announcements: [AnnouncementClip!]!

  "The Scriptural Rosary: each mystery's verses in bead order."
  verses: [VerseGroup!]!

  "The Prayer Book's prayers."
  book: [RosaryClip!]!
}

type NarrationVoice {
  "What a client stores and sends back, as in ?voice=female."
  slug: String!

  name: String!

  description: String

  "The voice heard when a client names none. Exactly one offered voice is."
  default: Boolean!

  retired: Boolean!

  "For a retired voice, the slug of the voice a request for it is served by."
  replacedBy: String
}

"The result of the :record_completion mutation"
type RecordCompletionResult {
  "The successful result of the mutation"
  result: Completion

  "Any errors generated, if the mutation failed"
  errors: [MutationError!]!
}

input RecordCompletionInput {
  meditationSetId: ID!
  prayedAloud: Boolean
}

type Completion {
  id: ID!
  completedAt: DateTime!
  meditationSetId: ID!
}

type SetMembership {
  id: ID!
  order: Int!
  meditation: Meditation!
}

type MeditationSet {
  id: ID!

  name: String!

  category: String!

  description: String

  labels: [String!]!

  setMemberships: [SetMembership!]!

  "The author the set is shown with: its own, or else the one its meditations agree on."
  author: String

  "The source the set is shown with: its own, or else the one its meditations agree on."
  source: String

  "The painting the set is shown with: its own, or else its author's portrait. Null when neither is publishable."
  artwork: Artwork
}

type Meditation {
  id: ID!

  title: String

  content: String!

  author: String

  source: String

  mystery: Mystery!

  "Every recording of the meditation as a playable URL, the default voice first. Empty when nothing is recorded; null when recordings exist but cannot be signed just now (see narratedVoices)."
  narrations: [SignedNarration!]

  "The voices that have recorded the meditation, default first. Signs nothing."
  narratedVoices: [String!]!

  "The recording to play for a listener who prefers a voice: that voice if it has recorded the meditation, otherwise the default. `preferring` is a voice slug: a retired voice means its successor, an unknown one is ignored. Null when nothing is recorded, or when it cannot be signed just now; narratedVoices tells the two apart."
  narration(preferring: String): SignedNarration
}

type Mystery {
  id: ID!
  name: String!
  category: String!
  order: Int!
  description: String
  scriptureReference: String
}

type RootQueryType {
  "Freshly signed narrations for meditations by id, in the order asked, each in the preferred voice where it has one. An id with nothing to play is left out."
  meditationAudio(
    meditationIds: [ID!]!

    "The voice preferred, a slug. A meditation it has not recorded, or an unknown slug, is answered in the default voice; each answer names the voice served."
    voice: String
  ): [MeditationNarration!]

  "The sets the public may see: those with at least one meditation and none archived. By category and then in creation order, optionally narrowed to one category. Never paginated."
  visibleMeditationSets(category: String): [MeditationSet!]!

  "One set the public may see, by id. Null when it does not exist or is hidden: it holds an archived meditation, or no meditations yet."
  meditationSet(
    "The id of the record"
    id: ID!
  ): MeditationSet

  "The voices a listener may choose, the default first."
  voices: [NarrationVoice!]!

  "Voices no longer offered, each with the voice that now answers for it."
  retiredVoices: [NarrationVoice!]!

  "One voice's spoken Rosary. Without a voice, the default voice's."
  rosaryAudio(
    "The voice preferred, a slug. A retired voice is answered by its successor and an unknown one by the default; `voice` in the answer is the one served."
    voice: String
  ): SpokenRosary

  "The Rosary's words as one document. There is only ever one."
  rosaryContent: RosaryContent!

  "The full text of one canonical hour on one date."
  officeHour(
    date: Date!

    "An hour slug, such as laudes; see officeVocabulary."
    hour: String!

    "A version slug; see officeVocabulary."
    version: String

    "A language slug; see officeVocabulary."
    language: String
  ): OfficeHour

  "All eight hours of one date, Matins to Compline, in that order."
  officeHours(
    date: Date!

    "A version slug; see officeVocabulary."
    version: String

    "A language slug; see officeVocabulary."
    language: String
  ): [OfficeHour!]

  "One day's place in the calendar: its celebration, season and rubric note."
  officeDay(
    date: Date!

    "A version slug; see officeVocabulary."
    version: String
  ): OfficeDay

  "One month of the liturgical calendar, its days in date order."
  officeCalendar(
    year: Int!

    month: Int!

    "A version slug; see officeVocabulary."
    version: String
  ): OfficeCalendar

  "The version, hour and language slugs the Office accepts, and its defaults."
  officeVocabulary: OfficeVocabulary!
}

type RootMutationType {
  "Records a finished Rosary reported by the app over the public write API. The client says which set and whether it was prayed aloud, and nothing else: the surface is always the app, and the set must be one the public can see."
  recordCompletion(input: RecordCompletionInput!): RecordCompletionResult!
}

"""
The `Json` scalar type represents arbitrary json string data, represented as UTF-8
character sequences. The Json type is most often used to represent a free-form
human-readable json string.
"""
scalar Json

"""
The `DateTime` scalar type represents a date and time in the UTC
timezone. The DateTime appears in a JSON response as an ISO8601 formatted
string, including UTC timezone ("Z"). The parsed date and time string will
be converted to UTC if there is an offset.
"""
scalar DateTime

"""
The `Date` scalar type represents a date. The Date appears in a JSON
response as an ISO8601 formatted string, without a time component.
"""
scalar Date
