schema {
  mutation: RootMutationType
  query: RootQueryType
}

type CarloHabit {
  "The reading on the `devotions` shelf that tells of it."
  readingId: String!

  "How often (`Daily`, `Weekly`)."
  often: String!

  "The habit (`Holy Mass`)."
  name: String!

  "The iOS app's glyph name for it, for reference."
  icon: String!

  "The act's button (`Pray it`), or null when there is no act."
  actTitle: String

  "The act that does it today, a door `act` target (`mass`, `todays_rosary`), or null."
  act: String
}

type CarloMoment {
  "The year (`1998`)."
  year: String!

  "What happened (`First Communion`)."
  title: String!

  "The reading on the `life` shelf it opens."
  readingId: String!

  "One line more."
  line: String!
}

type TrueDevotionPrayer {
  "Its title (`Totus Tuus`)."
  title: String!

  "The Latin, pairing with the English line for line."
  latin: String!

  "The English, in the Prayer Book's grammar."
  english: String!
}

type LibraryFeast {
  "The short name its reading goes by when that is not the feast's own (`Lepanto`), or null."
  readingName: String

  "The id of the reading about it on the same document's shelves, or null."
  readingId: String

  "The painting it is shown in, by the apps' painting name (`mary_immaculate_conception`), or null where none is set."
  painting: String

  "Its name (`Our Lady of Lourdes`)."
  name: String!

  "Its month, 1 to 12."
  month: Int!

  "The place or people it is kept by when it is not universal (`the Americas`), or null."
  keptBy: String

  "Whether it is on the universal 1962 calendar, so the Missal has its Mass. False for a later or local feast, which opens no Mass."
  inMissal: Boolean!

  "Its day of the month."
  day: Int!
}

type ReadingPart {
  "Its heading."
  title: String!

  "Its prose."
  text: String!
}

type LibraryReading {
  "Its title."
  title: String!

  "Two-column tables after the prose; often empty."
  tables: [ReadingTable!]!

  "A saying set apart, or null."
  quote: ReadingQuote

  "Named parts after the prose, each under its heading; often empty."
  parts: [ReadingPart!]!

  "Its prose, a paragraph to an item."
  paragraphs: [String!]!

  "The painting it is hung in, by the apps' painting name, or null."
  painting: String

  "The reading's id, unique across the app's shelves: a door of kind `reading` names it. Stable forever."
  id: String!

  "The feast it is kept on, or null."
  feast: LibraryFeast

  "Where the reading leads, in order; often empty."
  doors: [ReadingDoor!]!

  "One line under the title: the date, council, place or witness."
  detail: String!
}

type LibraryShelf {
  "Its name."
  title: String!

  "One line under the name."
  subtitle: String!

  "Its readings in order. A reading's place is shown as a Roman numeral."
  readings: [LibraryReading!]!

  "Its name for a narrow margin, with a line break (`\\n`) where it reads best."
  marginLabel: String!

  "The shelf's id. Stable forever."
  id: String!

  "The iOS app's glyph name for it (`ch-lily`), for reference."
  icon: String!

  "A closing line for a shelf that only samples a larger tradition, or null."
  footnote: String
}

type TrueDevotionParagraph {
  "The words, as printed. No markup."
  text: String!

  "`text`, a paragraph of the book, or `subheading`, a heading inside the chapter."
  kind: String!

  "Its place in the chapter, counting from 0. Stable forever with the chapter's id: a device keeps a reader's place by the two."
  id: Int!
}

type TrueDevotionChapter {
  "The chapter's title (`Motives for This Devotion`)."
  title: String!

  "The part it belongs to, a `number` in `parts`, or 0 for the Introduction, which is in none."
  part: Int!

  "Its paragraphs in reading order, their ids 0, 1, 2 and on."
  paragraphs: [TrueDevotionParagraph!]!

  "The chapter's id (`introduction`, `motives`). Stable forever: a device keeps a reader's progress by it."
  id: String!
}

type TrueDevotionPart {
  "Its heading (`Part I — On Devotion to Our Lady in General`)."
  title: String!

  "The part, 1 or 2, as a chapter's `part` names it."
  number: Int!
}

type TrueDevotionAbout {
  "The translation, as the title page credits it."
  translator: String!

  "The book's title (`True Devotion to the Blessed Virgin`)."
  title: String!

  "The edition the text is taken from, and that it is in the public domain."
  sourceNote: String!

  "Who wrote it (`St. Louis-Marie Grignion de Montfort`)."
  author: String!
}

type MarianFeast {
  "Its name (`The Assumption`)."
  name: String!

  "Its month, from 1 to 12."
  month: Int!

  "The feast's id (`assumption`). Stable forever: a device stores it."
  id: String!

  "What it celebrates, in a few words."
  description: String!

  "Its day of the month."
  day: Int!
}

type ConsecrationPrayer {
  "Its English title."
  title: String!

  "Its Latin title (`Veni Creator Spiritus`), or null."
  latinTitle: String

  "The Latin, or null for a prayer said in English alone. It pairs with the English line for line, blank lines included."
  latin: String

  "The prayer's id (`veni_creator`). Stable forever."
  id: String!

  "The words, in the app's PrayerText grammar: one line per paragraph, versicles and responses marked, a rubric in square brackets."
  english: String!
}

type ConsecrationReading {
  "Its citation (`Matthew 5:1-19`, `True Devotion, paragraph 227`)."
  title: String!

  "The reading, in the app's ReadingText grammar: paragraphs parted by a blank line, a paragraph starting `# ` a heading."
  text: String!

  "The work it comes from (`Douay-Rheims Bible`, `Thomas à Kempis`, `St. Louis de Montfort`), or null."
  source: String

  "Its place in the day, counting from 1."
  order: Int!
}

type ConsecrationDay {
  "The day's theme (`The Spirit of the World`)."
  title: String!

  "The day's readings, in the order they are read."
  readings: [ConsecrationReading!]!

  "The phase it belongs to, one of the document's phases."
  phaseId: String!

  "The day, from 1 to 34. Day 34 is Consecration Day, the feast itself."
  number: Int!

  "The question the day leaves for the journal."
  journalPrompt: String!
}

type ConsecrationPhase {
  "What the phase is for (`Knowing Yourself`)."
  subtitle: String!

  "The prayers said on each of its days, in order. Every id is one of the document's prayers."
  prayerIds: [String!]!

  "The app's painting that heads the phase's days (`luminous_baptism`), the same name in both apps' bundles."
  painting: String!

  "What the phase is called on screen (`Days 1–12`, `Week 1`)."
  name: String!

  "Its last day."
  lastDay: Int!

  "The phase's id (`knowledge_of_self`). Stable forever."
  id: String!

  "Its first day, counting from 1."
  firstDay: Int!
}

type ChantAudio {
  "A public, unsigned URL that never changes what it serves: a new recording is a new URL. Cache by it."
  url: String!

  "The file's SHA-256, lowercase hex, to check a download against."
  sha256: String!

  "The file's size."
  bytes: Int!
}

type ChantLine {
  "When it begins, in seconds."
  start: Float!

  "The score page it is sung from (an index into the chant's `score`, counting from 0), or null when the chant does not say."
  part: Int

  "The Latin, as sung."
  latin: String!

  "The English beside it."
  english: String!

  "When it ends, in seconds."
  end: Float!
}

type ChantScorePart {
  "A public, unsigned URL that never changes what it serves: a new drawing is a new URL. Cache by it."
  url: String!

  "The file's SHA-256, lowercase hex, to check a download against."
  sha256: String!

  "The score's name (`chant-salve-regina-simple`). Chants share some (`chant-vers-alt-ora-pro-nobis`)."
  file: String!

  "What the page holds."
  caption: String!

  "The file's size."
  bytes: Int!

  "Width over height, to lay out the page before it is drawn."
  aspectRatio: Float!
}

type Chant {
  "Where the recording and score were published (Verbum Gloriae)."
  sourceUrl: String!

  "Which melody, where there is more than one (`Simple melody`), or null."
  setting: String

  "The sheet music, page by page in order."
  score: [ChantScorePart!]!

  "The prayers it sings. A client takes the first chant listed for a prayer."
  prayerIds: [String!]!

  "The words as sung, timed to the recording, in order. Empty when not timed."
  lines: [ChantLine!]!

  "Its Latin title."
  latinTitle: String!

  "The chant's id. Stable forever: a device stores it for favourites."
  id: String!

  "The group it belongs to."
  groupId: String!

  "Its English title."
  englishTitle: String!

  "The recording's length in seconds."
  duration: Float!

  "When it is sung, in one line."
  detail: String!

  "The recording."
  audio: ChantAudio!
}

type ChantGroupPart {
  "The part's heading (`Advent`), or null."
  title: String

  "When it is sung, or null."
  note: String

  "Its chants in order, each one of the document's chants."
  chantIds: [String!]!
}

type ChantGroup {
  "Its title."
  title: String!

  "Its parts in order."
  parts: [ChantGroupPart!]!

  "What it holds, in one line, or null."
  note: String

  "The group's id. Stable forever."
  id: String!
}

type MarianAntiphon {
  "Its English name."
  title: String!

  "When it is sung, as the app prints it (`Pentecost to Advent`)."
  season: String!

  "The song, one of the document's prayers (`hail_holy_queen`)."
  prayerId: String!

  "Its Latin name."
  latinTitle: String!

  "The day its season begins: `advent_eve` (the day before the First Sunday of Advent), `february_2`, `easter` (Easter Sunday) or `pentecost_saturday` (the Saturday after Pentecost). Each is sung until the next one begins."
  begins: String!
}

type PrayerOrderVariant {
  "Its name in the season."
  title: String!

  "Its prayers in the season, each one of the document's prayers."
  prayerIds: [String!]!
}

type PrayerOrder {
  "Its name (`Morning Prayers`)."
  title: String!

  "Other names it is looked for by, beside its titles. Empty when none."
  searchWords: [String!]!

  "Its prayers in the order they are said, each one of the document's prayers. Outside Eastertide, and before the closing song to Mary."
  prayerIds: [String!]!

  "When it is prayed, as a short kicker (`On waking`)."
  occasion: String!

  "Its Latin name."
  latinTitle: String!

  "What the order becomes from Easter Sunday to the Saturday after Pentecost (the Angelus gives way to Queen of Heaven), or null when it does not change."
  inEastertide: PrayerOrderVariant

  "The order's id (`morning`). Stable forever: a device stores it."
  id: String!

  "What it is, in one plain sentence."
  detail: String!

  "Whether the order ends on the season's song to Mary, one of `marian_antiphons` (Night Prayers do)."
  closesWithMarianAntiphon: Boolean!

  "The chapter it is shown in, one of the document's chapters, or null."
  chapterId: String
}

type PrayerBookSection {
  "The sub-heading."
  title: String!

  "The prayers under it, in order, each one of the document's prayers. A prayer may stand under two sub-headings."
  prayerIds: [String!]!
}

type PrayerBookChapter {
  "What it is about, in a few words, or null."
  topic: String

  "Its title."
  title: String!

  "Its sub-headings in order, each with its prayers."
  sections: [PrayerBookSection!]!

  "Other words it is looked for by. Empty when none."
  searchWords: [String!]!

  "Its prayers in the chapter's order, each once: the union of its sections' prayers. Every id is one of the document's prayers."
  prayerIds: [String!]!

  "Its Roman numeral (`IV`)."
  numeral: String!

  "The chapter's one italic line, or null."
  note: String

  "Its Latin title."
  latinTitle: String!

  "The chapter's id. Stable forever."
  id: String!
}

type BookPrayer {
  "The prayer's title on its own page."
  title: String!

  "Other names it is looked for by, beside its titles. Empty when none."
  searchWords: [String!]!

  "Who wrote it and when, as a prayer book's small print, or null."
  origin: String

  "When or how it is said, in one plain sentence, or null."
  note: String

  "Its name in a list (`Hail Mary`), or null to use the title."
  listTitle: String

  "Its name in the Church's own tongue (`Sub tuum praesidium`), or null for a prayer composed in English."
  latinTitle: String

  "The Latin, or null when the prayer has none. It pairs with the English line for line, blank lines included."
  latin: String

  "The prayer's id (`sub_tuum`). Stable forever: a device stores it for saved prayers."
  id: String!

  "The English name set small beneath a prayer known by its Latin one (`Memorare`), or null."
  englishName: String

  "The words, in the app's PrayerText grammar: one line per paragraph, versicles and responses marked, a rubric in square brackets."
  english: String!
}

type ScriptStep {
  "Where on the pendant it is said; null in a decade."
  place: String

  "`opening`, `decade` or `closing`."
  phase: String!

  "The silence after it, in milliseconds."
  pauseMs: Int!

  "The clip it plays: the prayer id; the mystery's key, `<category>_<order>`, for an announcement or a meditation (the set's own narration); `<key>_<n>` for the verse before Hail Mary n."
  name: String!

  "The decade's mystery key; null on the pendant. (The iOS app's own script gives the opening prayers the first decade's key and the closing prayers the last's.)"
  mystery: String

  "`prayer`, `announcement`, `meditation` or `verse`."
  kind: String!

  "The decade, counted from 0; null on the pendant. (The iOS app's own script counts the opening prayers in decade 0 and the closing prayers in the last.)"
  decade: Int

  "What the screen calls it."
  caption: String!

  "The bead of the decade's strand it is said on: 0 the Our Father, n Hail Mary n, one past the last the Glory Be. The opening is said on the first decade's bead 0, the close on the last decade's Glory Be bead."
  bead: Int!
}

type RosaryChoiceOption {
  "The setting's value: Audio's is true for the Whole Rosary, Counting's true for the beads on the screen."
  value: Boolean!

  "What the chosen option does, as what is heard or seen."
  note: String!

  "What the option is called."
  name: String!

  "`meditation`, `scriptural` or `any`. Audio is named and explained differently for a meditation set and for the Scriptural Rosary; Counting is the same for both (`any`)."
  form: String!
}

type RosaryChoice {
  "What the choice is called."
  title: String!

  "The options, the quieter way (value false) first. For a form, use those whose `form` is the form's id, or else `any`."
  options: [RosaryChoiceOption!]!

  "`audio` or `counting`."
  id: String!

  "The glyph, by the iOS app's icon name."
  icon: String!
}

type RosaryFormInfo {
  "The line under the name on the form's own page."
  subtitle: String!

  "What the Prayer Record keeps a prayer of this form under. It is the old name for the Audio Rosary, because the record already holds days under it; a client that wants its history readable beside the iOS app's keeps the same."
  recordedAs: String!

  "The form's name wherever it is shown."
  name: String!

  "The line over the name on the form's own page."
  kicker: String!

  "`scriptural` or `holy` (the Audio Rosary), the iOS app's names for the forms."
  id: String!

  "The line under the name where the form is listed under Ways to Pray."
  detail: String!

  "What the form is, on the page's ledger."
  about: String!
}

type RosaryFormRule {
  "The ids, in order, while it is not."
  whenSilent: [String!]!

  "The ids, in order, while the Audio choice is the Whole Rosary. Always the case in the Audio Rosary."
  whenAloud: [String!]!

  "`meditation`, `scriptural` or `holy`."
  form: String!
}

type RosaryRowTitle {
  "The row's name."
  title: String!

  "`audio`, `mysteries` or `voice`."
  id: String!
}

type RosaryForms {
  "Which rows a form's page carries beneath the choices, by row id, in the same two cases."
  rows: [RosaryFormRule!]!

  "What each row is called."
  rowTitles: [RosaryRowTitle!]!

  "Which choices a form's page offers, by choice id, while the Audio choice is Whole Rosary (`when_aloud`) and while it is not (`when_silent`)."
  offered: [RosaryFormRule!]!

  "What the Audio Rosary's audio row says, as a fact rather than a choice."
  holyAudioValue: String!

  "The two forms with a name of their own: the Scriptural Rosary and the Audio Rosary. The third form, a meditation set, is named by the set."
  forms: [RosaryFormInfo!]!

  "The two choices that change how the Rosary is prayed, Audio and Counting."
  choices: [RosaryChoice!]!
}

type MeditationKind {
  "A short heading."
  title: String!

  "The stored label it explains."
  label: String!

  "The glyph, by the iOS app's icon name."
  icon: String!

  "What it is like, then, after a blank line, the voices that carry it. The voices are examples, not an index: the library grows."
  description: String!
}

type LabelName {
  "What a reader sees. Equal to `id` where the app does not reword it (`Considerations` reads Reflections, `Contemplative` Inside the Scene, `Scriptural` Gospel)."
  name: String!

  "The label as a set stores and serves it: raw, case-sensitive."
  id: String!
}

type RosaryLabels {
  "Every label a set may carry, in the vocabulary's order. A set's labels are stored as `id`."
  labels: [LabelName!]!

  "The kinds of meditation, for the page that explains them."
  kinds: [MeditationKind!]!
}

type ReminderMessage {
  "The notification's title."
  title: String!

  "The notification's body."
  body: String!
}

type ReminderGroup {
  "The group's messages, in the order the rotation counts them."
  messages: [ReminderMessage!]!

  "The group's key (`peace`, `habit`, `devotion`, `learning`, `standard`)."
  id: String!
}

type ReminderIntention {
  "The string the iOS app stores for the choice. It never changes, so a client that wants to read an iOS-kept answer can match it."
  rawValue: String!

  "What the choice is called on screen."
  name: String!

  "The intention's key (`peace`), which names its groups."
  id: String!

  "The groups this intention draws from, in order. Someone still learning has not settled into one way of praying, so `learning` lists them all."
  groups: [String!]!

  "The line under the name."
  detail: String!
}

type RosaryReminders {
  "The number of reminders scheduled at once, one for each weekday."
  weekLength: Int!

  "What can draw someone to the Rosary, and the groups each draws its reminders from."
  intentions: [ReminderIntention!]!

  "The message groups. Titles are under about 35 characters and bodies under about 75, so neither is cut on a lock screen. No message holds a placeholder: each is shown as it is written."
  groups: [ReminderGroup!]!

  "The group used when no intention was chosen."
  fallbackGroup: String!
}

type RosaryMilestone {
  "What the Church calls a run of this length, in plain words (`a novena`), where it has a name. Shown after the days, never alone. Null where it has none."
  meaning: String

  "The glyph on the milestone's badge, by the iOS app's icon name: a numeral (`ph-number-circle-nine`) or a named devotion's sign (`lv-rosary`). An Android client draws its own for each name."
  icon: String!

  "The consecutive days of prayer. The milestone is earned at exactly this streak."
  days: Int!

  "The line shown when the milestone is reached."
  blessing: String!
}

type RosaryQuote {
  "The words."
  text: String!

  "The work or occasion, only where it can be cited with confidence. Null where the attribution is traditional rather than documented."
  source: String

  "Who is quoted, named as the Church now names them (`St. Pius X`, `Bl. Pius IX`)."
  author: String!
}

type QuoteRotation {
  "The offset for the home screen's quotation: `items[(day_of_year + home_offset) mod count]`."
  homeOffset: Int!

  "The offset for the quotation after praying is the number of quotations divided by this, rounded down: `items[(day_of_year + count div divisor) mod count]`, half the catalogue from the home screen's so one session never shows one line twice."
  afterPrayerOffsetDivisor: Int!
}

type RosaryQuotes {
  "How a quotation is chosen for a day."
  rotation: QuoteRotation!

  "The quotations, in the order the rotation counts them. A client should keep to this order: the rotation indexes into it."
  items: [RosaryQuote!]!
}

type RosaryVerse {
  "The verse, in the original Douay-Rheims, exactly as the spoken Rosary says it."
