type RosaryScript {
  "The Rosary described: its category, style, extras and orders, separated by colons."
  id: String!

  category: String!

  style: String!

  "The optional prayers said, in the order they are said."
  extras: [String!]!

  "The mysteries' orders, one per decade, in prayer order."
