schema {
  mutation: RootMutationType
  query: RootQueryType
}

type ScriptStep {
  "Where on the pendant it is said; null in a decade."
  place: String

  "`opening`, `decade` or `closing`."
  phase: String!

  "The silence after it, in milliseconds."
  pauseMs: Int!

  "The clip it plays: the prayer id; the mystery's key, `<category>_<order>`, for an announcement or a meditation (the set's own narration); `<key>_<n>` for the verse before Hail Mary n."
  name: String!

  "The decade's mystery key; null on the pendant. (The iOS app's own script gives the opening prayers the first decade's key and the closing prayers the last's.)"
  mystery: String

  "`prayer`, `announcement`, `meditation` or `verse`."
  kind: String!

  "The decade, counted from 0; null on the pendant. (The iOS app's own script counts the opening prayers in decade 0 and the closing prayers in the last.)"
  decade: Int

  "What the screen calls it."
  caption: String!

  "The bead of the decade's strand it is said on: 0 the Our Father, n Hail Mary n, one past the last the Glory Be. The opening is said on the first decade's bead 0, the close on the last decade's Glory Be bead."
  bead: Int!
}

type BeadLabelLines {
  "An Our Father bead."
  ourFather: [String!]!

  "Hail Mary n's bead."
  hailMary: [String!]!

  "The Glory Be's bead."
  gloryBe: [String!]!
}

type BeadLabels {
  "An Our Father bead."
  ourFather: String!

  "Hail Mary n's bead."
  hailMary: String!

  "The Glory Be's bead."
  gloryBe: String!
}

type StrandLabels {
  "Beside an Our Father bead; `{decade}` is the decade's number, counted from 1."
  ourFather: String!

  "Beside the final bead."
  amen: String!
}

type RosaryStrand {
  "The labels drawn beside the strand."
  strandLabels: StrandLabels!

  "What the bead under the hand is called."
  labels: BeadLabels!

  "The same names broken for a narrow margin."
  labelLines: BeadLabelLines!

  "Hail Marys in each decade."
  hailMarys: Int!

  "The bead of a decade the Glory Be is said on: one past its last Hail Mary, which is the next decade's Our Father bead."
  gloryBeBead: Int!

  "Whether a decade closes with the Fatima Prayer after its Glory Be."
  fatimaPrayer: Boolean!

  "Decades on the strand: five, or the seven sorrows."
  decades: Int!

  "Beads in a decade: its Our Father and its Hail Marys."
  decadeLength: Int!

  "Every bead on the strand, the final bead included."
  beads: Int!
}

type ScriptForm {
  "Whether the optional prayers after the Rosary are said in this form."
  takesExtras: Boolean!

  "The strand of beads the decades are prayed on."
  strand: RosaryStrand!

  "The prayers on the pendant before the first decade."
  opening: [ScriptTemplateStep!]!

  "The last words, after any optional prayers."
  final: [ScriptTemplateStep!]!

  "One decade. The run of steps marked `per_bead` is said once for each Hail Mary, in order; a step with a `style` is said only in that style."
  decade: [ScriptTemplateStep!]!

  "The prayers after the last decade, before any optional prayers."
  closing: [ScriptTemplateStep!]!

  "The mystery categories prayed in this form."
  categories: [String!]!
}

type ScriptTemplateStep {
  "The only style the step is said in (`meditation`, `scriptural`); null in every style."
  style: String

  "The prayer said, for a `prayer` step: an id in the `prayers` section."
  prayerId: String

  "Where on the pendant it is said, one of `pendant`'s places; null in a decade."
  place: String

  "Said once for each Hail Mary of the decade, with the other `per_bead` steps beside it, in order."
  perBead: Boolean!

  "The silence after the step, in milliseconds."
  pauseMs: Int!

  "`prayer`, `announcement` (the mystery named), `meditation` (the set's own narration) or `verse` (the Scriptural Rosary's verse for one Hail Mary)."
  kind: String!

  "What the screen calls the step. In a `per_bead` step, `{n}` stands for the Hail Mary's number."
  caption: String!

  "The bead of the decade's strand it is said on: 0 the Our Father, the strand's `glory_be_bead` the Glory Be. Null in a `per_bead` step, which is said on Hail Mary n's bead, n."
  bead: Int
}

type ClosingExtra {
  "What the setting is called."
  title: String!

  "The prayers said."
  steps: [ScriptTemplateStep!]!

  "The name where three share a row."
  shortTitle: String!

  "`holy_father`, `memorare` or `st_michael`: what `extras` names in `GET \/api\/v2\/rosary-script`."
  id: String!

  "What the setting adds, said as what is prayed."
  detail: String!
}

type ScriptHeadings {
  "Before the first decade."
  opening: String!

  "After the last."
  closing: String!
}

type PendantPlace {
  "`cross`, `large_bead`, `small_bead_1` to `small_bead_3`, `chain` or `medal`."
  place: String!

  "What it is called, for a screen reader."
  name: String!
}

type RosaryScriptTemplates {
  "The styles a Rosary is said in: `meditation`, `scriptural`, `plain` (the Rosary Said Aloud)."
  styles: [String!]!

  "The four Rosaries: Joyful, Sorrowful, Glorious and Luminous."
  rosary: ScriptForm!

  "The places on the pendant, climbing from the crucifix to the medal."
  pendant: [PendantPlace!]!

  "What the screen calls the prayers said on the pendant."
  headings: ScriptHeadings!

  "The optional prayers after a Rosary's closing prayer, in the order they are said whatever order they are chosen in."
  closingExtras: [ClosingExtra!]!

  "The Seven Sorrows chaplet, in its Servite form."
  chaplet: ScriptForm!
}

type ScheduleDays {
  "What the app shows under the set's name: `days_prayed`, or for a set the schedule never reaches, when it is kept (`Fridays, and on her feast, September 15`; `Any day you choose`)."
  words: String!

  "The days the schedule prays it (`Monday, Thursday, Sundays of Advent`), or null when the schedule never reaches it: the Luminous on the traditional schedule, the Seven Sorrows on either."
  daysPrayed: String

  "A category slug."
  category: String!
}

type ScheduleSunday {
  "Any other Sunday, Christmastide and Eastertide included."
  ordinary: String!

  "A Sunday of Lent."
  lent: String!

  "A Sunday of Advent."
  advent: String!
}

type ScheduleWeekdays {
  "A category slug."
  wednesday: String!

  "A category slug."
  tuesday: String!

  "A category slug."
  thursday: String!

  "A category slug."
  saturday: String!

  "A category slug."
  monday: String!

  "A category slug."
  friday: String!
}

type MysterySchedule {
  "The category of each day from Monday to Saturday. The day is the device's calendar day, turning at midnight; not the prayer day that turns at four in the morning."
  weekdays: ScheduleWeekdays!

  "Sunday's category, by the season the Sunday falls in (see `seasons`)."
  sunday: ScheduleSunday!

  "`traditional` (Joyful on Thursday, Glorious on Saturday) or `modern` (Rosarium Virginis Mariae 38: Luminous on Thursday, Joyful on Saturday)."
  id: String!

  "Category slugs in the order the home grid shows them: the sets the week prays, in the week's order from Monday, then the Seven Sorrows."
  grid: [String!]!

  "Each of the five categories, in the app's order, with the days it is prayed in words."
  days: [ScheduleDays!]!
}

type RosarySeason {
  "Its first day: Ash Wednesday, or the first Sunday of Advent."
  startsOn: Date!

  "`lent` or `advent`."
  season: String!

  "Its last day, included: Holy Saturday, or December 24. Easter and Christmas are ordinary."
  endsOn: Date!
}

type RosarySchedule {
  "The last date `seasons` answers for: December 31 three years ahead."
  seasonsThrough: Date!

  "The first date `seasons` answers for: January 1 of last year. The range moves on when the year turns, and with it the document's version."
  seasonsFrom: Date!

  "Every Lent and Advent from `seasons_from` through `seasons_through`, in calendar order. A date inside one is in that season; every other date in the range is `ordinary`, Christmastide and Eastertide included."
  seasons: [RosarySeason!]!

  "The weekly schedules, the default first. A client should pass over a schedule whose id it does not know."
  schedules: [MysterySchedule!]!

  "The id of the schedule a client follows until its reader chooses another: `traditional`."
  default: String!
}

type RosaryAnatomy {
  "What is prayed there."
  prayed: String!

  "The beads it names (keys in `parts`), in the order the fingers travel them."
  parts: [String!]!

  "Its name."
  name: String!

  "Its id."
  id: String!
}

type GuidedStep {
  "The prayers said here, in order (ids in the `prayers` section); empty for a mystery's announcement."
  prayerIds: [String!]!

  "Where on the Rosary, as the app names it: \"The crucifix\", \"The Annunciation · 3 of 10\"."
  place: String!

  "The bead under the fingers (a key in `parts`)."
  part: String!

  "What to do here, in plain words."
  instruction: String!

  "The decade it belongs to, from 0, or null for the opening and closing prayers."
  decade: Int

  "Whether it is one of the closing prayers, after the last decade, when every bead is behind the fingers."
  closing: Boolean!

  "Whether it names the mystery before its decade."
  announcement: Boolean!
}

type GuidedMysteries {
  "Every step, in order: 75 for a Rosary of five decades. A step is known by its place in the list, from 0."
  steps: [GuidedStep!]!

  "A category slug."
  category: String!
}

type GuidedRosary {
  "The steps for each set the guide can walk: the Joyful, Sorrowful, Glorious and Luminous. The Seven Sorrows chaplet is not guided."
  rosaries: [GuidedMysteries!]!

  "Every bead of a rosary, in the order the fingers travel them: `crucifix`, `pendantLarge.0`, `pendantSmall.0`-`.2`, `pendantLarge.1`, the loop (`loopSmall.<decade>.<bead>`, decades and beads from 0, with `loopLarge.0`-`.3` between the tens), and `medal`. A step's `part` and an anatomy's `parts` are these keys, which never change."
  parts: [String!]!

  "The first step (from 0) at which a place is worth keeping, and leaving asks first: the Our Father on the first large bead."
  firstKeptStep: Int!

  "How the prayer record names a Rosary prayed with the guide: \"A Guided Rosary\". It counts as the day's Rosary."
  devotionName: String!

  "The parts of a rosary as a beginner learns them."
  anatomy: [RosaryAnatomy!]!
}

