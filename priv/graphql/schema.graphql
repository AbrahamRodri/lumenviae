schema {
  mutation: RootMutationType
  query: RootQueryType
}

type ScriptStep {
  "Where on the pendant it is said; null in a decade."
  place: String

  "`opening`, `decade` or `closing`."
  phase: String!

  "The silence after it, in milliseconds."
  pauseMs: Int!

  "The clip it plays: the prayer id; the mystery's key, `<category>_<order>`, for an announcement or a meditation (the set's own narration); `<key>_<n>` for the verse before Hail Mary n."
  name: String!

  "The decade's mystery key; null on the pendant. (The iOS app's own script gives the opening prayers the first decade's key and the closing prayers the last's.)"
  mystery: String

  "`prayer`, `announcement`, `meditation` or `verse`."
  kind: String!

  "The decade, counted from 0; null on the pendant. (The iOS app's own script counts the opening prayers in decade 0 and the closing prayers in the last.)"
  decade: Int

  "What the screen calls it."
  caption: String!

  "The bead of the decade's strand it is said on: 0 the Our Father, n Hail Mary n, one past the last the Glory Be. The opening is said on the first decade's bead 0, the close on the last decade's Glory Be bead."
  bead: Int!
}

type RosaryChoiceOption {
  "The setting's value: Audio's is true for the Whole Rosary, Counting's true for the beads on the screen."
  value: Boolean!

  "What the chosen option does, as what is heard or seen."
  note: String!

  "What the option is called."
  name: String!

  "`meditation`, `scriptural` or `any`. Audio is named and explained differently for a meditation set and for the Scriptural Rosary; Counting is the same for both (`any`)."
  form: String!
}

type RosaryChoice {
  "What the choice is called."
  title: String!

  "The options, the quieter way (value false) first. For a form, use those whose `form` is the form's id, or else `any`."
  options: [RosaryChoiceOption!]!

  "`audio` or `counting`."
  id: String!

  "The glyph, by the iOS app's icon name."
  icon: String!
}

type RosaryFormInfo {
  "The line under the name on the form's own page."
  subtitle: String!

  "What the Prayer Record keeps a prayer of this form under. It is the old name for the Rosary Said Aloud, because the record already holds days under it; a client that wants its history readable beside the iOS app's keeps the same."
  recordedAs: String!

  "The form's name wherever it is shown."
  name: String!

  "The line over the name on the form's own page."
  kicker: String!

  "`scriptural` or `holy` (the Rosary Said Aloud), the iOS app's names for the forms."
  id: String!

  "The line under the name where the form is listed under Ways to Pray."
  detail: String!

  "What the form is, on the page's ledger."
  about: String!
}

type RosaryFormRule {
  "The ids, in order, while it is not."
  whenSilent: [String!]!

  "The ids, in order, while the Audio choice is the Whole Rosary. Always the case in the Rosary Said Aloud."
  whenAloud: [String!]!

  "`meditation`, `scriptural` or `holy`."
  form: String!
}

type RosaryRowTitle {
  "The row's name."
  title: String!

  "`audio`, `mysteries` or `voice`."
  id: String!
}

type RosaryForms {
  "Which rows a form's page carries beneath the choices, by row id, in the same two cases."
  rows: [RosaryFormRule!]!

  "What each row is called."
  rowTitles: [RosaryRowTitle!]!

  "Which choices a form's page offers, by choice id, while the Audio choice is Whole Rosary (`when_aloud`) and while it is not (`when_silent`)."
  offered: [RosaryFormRule!]!

  "What the Rosary Said Aloud's audio row says, as a fact rather than a choice."
  holyAudioValue: String!

  "The two forms with a name of their own: the Scriptural Rosary and the Rosary Said Aloud. The third form, a meditation set, is named by the set."
  forms: [RosaryFormInfo!]!

  "The two choices that change how the Rosary is prayed, Audio and Counting."
  choices: [RosaryChoice!]!
}

type MeditationKind {
  "A short heading."
  title: String!

  "The stored label it explains."
  label: String!

  "The glyph, by the iOS app's icon name."
  icon: String!

  "What it is like, then, after a blank line, the voices that carry it. The voices are examples, not an index: the library grows."
  description: String!
}

type LabelName {
  "What a reader sees. Equal to `id` where the app does not reword it (`Considerations` reads Reflections, `Contemplative` Inside the Scene, `Scriptural` Gospel)."
  name: String!

  "The label as a set stores and serves it: raw, case-sensitive."
  id: String!
}

type RosaryLabels {
  "Every label a set may carry, in the vocabulary's order. A set's labels are stored as `id`."
  labels: [LabelName!]!

  "The kinds of meditation, for the page that explains them."
  kinds: [MeditationKind!]!
}

type ReminderMessage {
  "The notification's title."
  title: String!

  "The notification's body."
  body: String!
}

type ReminderGroup {
  "The group's messages, in the order the rotation counts them."
  messages: [ReminderMessage!]!

  "The group's key (`peace`, `habit`, `devotion`, `learning`, `standard`)."
  id: String!
}

type ReminderIntention {
  "The string the iOS app stores for the choice. It never changes, so a client that wants to read an iOS-kept answer can match it."
  rawValue: String!

  "What the choice is called on screen."
  name: String!

  "The intention's key (`peace`), which names its groups."
  id: String!

  "The groups this intention draws from, in order. Someone still learning has not settled into one way of praying, so `learning` lists them all."
  groups: [String!]!

  "The line under the name."
  detail: String!
}

type RosaryReminders {
  "The number of reminders scheduled at once, one for each weekday."
  weekLength: Int!

  "What can draw someone to the Rosary, and the groups each draws its reminders from."
  intentions: [ReminderIntention!]!

  "The message groups. Titles are under about 35 characters and bodies under about 75, so neither is cut on a lock screen. No message holds a placeholder: each is shown as it is written."
  groups: [ReminderGroup!]!

  "The group used when no intention was chosen."
  fallbackGroup: String!
}

type RosaryMilestone {
  "What the Church calls a run of this length, in plain words (`a novena`), where it has a name. Shown after the days, never alone. Null where it has none."
  meaning: String

  "The glyph on the milestone's badge, by the iOS app's icon name: a numeral (`ph-number-circle-nine`) or a named devotion's sign (`lv-rosary`). An Android client draws its own for each name."
  icon: String!

  "The consecutive days of prayer. The milestone is earned at exactly this streak."
  days: Int!

  "The line shown when the milestone is reached."
  blessing: String!
}

type RosaryQuote {
  "The words."
  text: String!

  "The work or occasion, only where it can be cited with confidence. Null where the attribution is traditional rather than documented."
  source: String

  "Who is quoted, named as the Church now names them (`St. Pius X`, `Bl. Pius IX`)."
  author: String!
}

type QuoteRotation {
  "The offset for the home screen's quotation: `items[(day_of_year + home_offset) mod count]`."
  homeOffset: Int!

  "The offset for the quotation after praying is the number of quotations divided by this, rounded down: `items[(day_of_year + count div divisor) mod count]`, half the catalogue from the home screen's so one session never shows one line twice."
  afterPrayerOffsetDivisor: Int!
}

type RosaryQuotes {
  "How a quotation is chosen for a day."
  rotation: QuoteRotation!

  "The quotations, in the order the rotation counts them. A client should keep to this order: the rotation indexes into it."
  items: [RosaryQuote!]!
}

type RosaryVerse {
  "The verse, in the original Douay-Rheims, exactly as the spoken Rosary says it."
  text: String!

  "Its citation: `Luke 1:26`."
  reference: String!

  "The Hail Mary it is said before, counting from 1."
  bead: Int!
}

type RosaryVerses {
  "One verse per Hail Mary, in bead order."
  verses: [RosaryVerse!]!

  "The mystery's key: `joyful_1`."
  key: String!
}

type RosaryCategory {
  "What its mysteries are about, in everyday words."
  subtitle: String!

  "`joyful`, `sorrowful`, `glorious`, `luminous` or `seven_sorrows`."
  slug: String!

  "Its short name: `Joyful`."
  name: String!

  "Each mystery's label by position, from the first: `The First Joyful Mystery`, `The First Sorrow of Mary`. As many as the category has mysteries."
  mysteryLabels: [String!]!

  "Hail Marys in a decade: 10, or 7 in a sorrow of the chaplet."
  hailMarys: Int!

  "The graces promised to those who pray it: the seven of the Seven Sorrows, empty for the others."
  graces: [String!]!

  "Whether the Fatima Prayer follows the Glory Be at the end of each decade. False for the Seven Sorrows."
  fatimaPrayer: Boolean!

  "Its full title: `Joyful Mysteries`, `Seven Sorrows of Mary`."
  devotionTitle: String!
}

type RosaryMystery {
  "Where the Gospel tells it."
  scriptureReference: String

  "Its place in the category, from 1."
  order: Int!

  "The mystery's name."
  name: String!

  "The key verse's citation."
  keyVerseReference: String

  "One verse to carry into the decade, in the Douay-Rheims, without its citation. Another rendering than the Scriptural Rosary's verses, and served as written."
  keyVerse: String

  "`<category>_<order>`: `joyful_1`. The key the verses, the announcement and every other section use. Never the server's id."
  key: String!

  "The grace it is prayed for: `Humility`."
  fruit: String

  "A sentence on what happens in it."
  description: String

  "The category's slug."
  category: String!

  "What the spoken Rosary says before the decade, exactly as recorded: `The First Joyful Mystery: The Annunciation`."
  announcement: String!
}

type BeadLabelLines {
  "An Our Father bead."
  ourFather: [String!]!

  "Hail Mary n's bead."
  hailMary: [String!]!

  "The Glory Be's bead."
  gloryBe: [String!]!
}

type BeadLabels {
  "An Our Father bead."
  ourFather: String!

  "Hail Mary n's bead."
  hailMary: String!

  "The Glory Be's bead."
  gloryBe: String!
}

type StrandLabels {
  "Beside an Our Father bead; `{decade}` is the decade's number, counted from 1."
  ourFather: String!

  "Beside the final bead."
  amen: String!
}

type RosaryStrand {
  "The labels drawn beside the strand."
  strandLabels: StrandLabels!

  "What the bead under the hand is called."
  labels: BeadLabels!

  "The same names broken for a narrow margin."
  labelLines: BeadLabelLines!

  "Hail Marys in each decade."
  hailMarys: Int!

  "The bead of a decade the Glory Be is said on: one past its last Hail Mary, which is the next decade's Our Father bead."
  gloryBeBead: Int!

  "Whether a decade closes with the Fatima Prayer after its Glory Be."
  fatimaPrayer: Boolean!

  "Decades on the strand: five, or the seven sorrows."
  decades: Int!

  "Beads in a decade: its Our Father and its Hail Marys."
  decadeLength: Int!

  "Every bead on the strand, the final bead included."
  beads: Int!
}

type ScriptForm {
  "Whether the optional prayers after the Rosary are said in this form."
  takesExtras: Boolean!

  "The strand of beads the decades are prayed on."
  strand: RosaryStrand!

  "The prayers on the pendant before the first decade."
  opening: [ScriptTemplateStep!]!

  "The last words, after any optional prayers."
  final: [ScriptTemplateStep!]!

  "One decade. The run of steps marked `per_bead` is said once for each Hail Mary, in order; a step with a `style` is said only in that style."
  decade: [ScriptTemplateStep!]!

  "The prayers after the last decade, before any optional prayers."
  closing: [ScriptTemplateStep!]!

  "The mystery categories prayed in this form."
  categories: [String!]!
}

type ScriptTemplateStep {
  "The only style the step is said in (`meditation`, `scriptural`); null in every style."
  style: String

  "The prayer said, for a `prayer` step: an id in the `prayers` section."
  prayerId: String

  "Where on the pendant it is said, one of `pendant`'s places; null in a decade."
  place: String

  "Said once for each Hail Mary of the decade, with the other `per_bead` steps beside it, in order."
  perBead: Boolean!

  "The silence after the step, in milliseconds."
  pauseMs: Int!

  "`prayer`, `announcement` (the mystery named), `meditation` (the set's own narration) or `verse` (the Scriptural Rosary's verse for one Hail Mary)."
  kind: String!

  "What the screen calls the step. In a `per_bead` step, `{n}` stands for the Hail Mary's number."
  caption: String!

  "The bead of the decade's strand it is said on: 0 the Our Father, the strand's `glory_be_bead` the Glory Be. Null in a `per_bead` step, which is said on Hail Mary n's bead, n."
  bead: Int
}

type ClosingExtra {
  "What the setting is called."
